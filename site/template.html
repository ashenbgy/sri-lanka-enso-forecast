<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sri Lanka El Niño Outlook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --border: rgba(11,11,11,0.10);
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --wash: #f0efec;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --wet: #2a78d6; --dry: #e34948; --neutral: #898781;
  --div-neg: #e34948; --div-mid: #f0efec; --div-pos: #2a78d6;
  --seq-lo: #cde2fb; --seq-hi: #104281;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --border: rgba(255,255,255,0.10);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --wash: #262624;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --wet: #3987e5; --dry: #e66767; --neutral: #898781;
    --div-neg: #e66767; --div-mid: #383835; --div-pos: #3987e5;
    --seq-lo: #22303f; --seq-hi: #6da7ec;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --border: rgba(255,255,255,0.10);
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --wash: #262624;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --wet: #3987e5; --dry: #e66767; --neutral: #898781;
  --div-neg: #e66767; --div-mid: #383835; --div-pos: #3987e5;
  --seq-lo: #22303f; --seq-hi: #6da7ec;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 17px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans Sinhala", sans-serif;
}
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 2rem; line-height: 1.25; margin: 0 0 6px; }
h2 { font-size: 1.35rem; line-height: 1.35; margin: 0 0 6px; }
p { margin: 0 0 12px; }
.sub { color: var(--ink-2); }
.small { font-size: 0.9rem; color: var(--ink-2); }
.topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.lang { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: none; color: var(--ink-2); padding: 8px 16px; font: inherit; font-size: 0.95rem; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-top: 20px; }
.notice { background: var(--wash); border-radius: 10px; padding: 10px 14px; font-size: 0.92rem; color: var(--ink-2); margin-top: 14px; }

.summary { list-style: none; padding: 0; margin: 8px 0 0; }
.summary li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.summary li:last-child { border-bottom: 0; }
.summary .ic { font-size: 1.5rem; line-height: 1.2; flex: none; width: 2rem; text-align: center; }

.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 14px; }
.month { border: 1px solid var(--border); border-left: 5px solid var(--neutral); border-radius: 10px; padding: 12px 14px; }
.month.wet { border-left-color: var(--wet); }
.month.dry { border-left-color: var(--dry); }
.month .name { font-weight: 600; }
.month .big { font-size: 2rem; line-height: 1.2; margin: 4px 0; }
.month .verdict { font-weight: 600; }
.month .amount, .month .sure { color: var(--ink-2); font-size: 0.92rem; }

.effects { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 12px; }
.effect { background: var(--wash); border-radius: 10px; padding: 10px; text-align: center; }
.effect .e { font-size: 1.4rem; }
.effect .m { font-weight: 600; }
.effect .w { font-size: 0.88rem; color: var(--ink-2); }
.callout { border-left: 4px solid var(--s1); padding: 6px 0 6px 14px; margin-top: 14px; }

.regions { list-style: none; padding: 0; margin: 12px 0 0; }
.regions li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.regions .lvl { font-weight: 600; white-space: nowrap; }
.regions .times { grid-column: 1 / -1; color: var(--ink-2); font-size: 0.92rem; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 12px; }
.fact { background: var(--wash); border-radius: 10px; padding: 12px 14px; }
.fact .v { font-size: 1.5rem; font-weight: 600; }
.fact .l { color: var(--ink-2); font-size: 0.92rem; }

.chart { position: relative; height: 300px; margin-top: 12px; }
.key { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.92rem; color: var(--ink-2); margin-top: 8px; }
.key i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
details { margin-top: 14px; border-top: 1px solid var(--grid); padding-top: 10px; }
summary { cursor: pointer; color: var(--s1); font-weight: 600; font-size: 0.95rem; }
.scroll { overflow-x: auto; margin-top: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 600; }
table.heat td:not(:first-child) { text-align: center; border: 2px solid var(--surface); }
dl { margin: 8px 0 0; }
dt { font-weight: 700; margin-top: 12px; }
dd { margin: 2px 0 0; color: var(--ink-2); }
footer { margin-top: 28px; color: var(--ink-2); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" id="asof"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="si">සිංහල</button>
    </div>
  </div>
  <p class="notice" data-t="disclaimer"></p>

  <section class="card">
    <h2 data-t="sumH"></h2>
    <ul class="summary" id="summary"></ul>
  </section>

  <section class="card">
    <h2 data-t="slH"></h2>
    <p class="sub" data-t="slP"></p>
    <div class="months" id="months"></div>
    <div class="chart"><canvas id="rainChart" role="img"></canvas></div>
    <div class="key"><span><i style="background:var(--wet)"></i><span data-t="keyWet"></span></span>
      <span><i style="background:var(--dry)"></i><span data-t="keyDry"></span></span></div>
    <details><summary data-t="showNumbers"></summary><div class="scroll"><table id="rainTable"></table></div></details>
  </section>

  <section class="card">
    <h2 data-t="townH"></h2>
    <p class="sub" data-t="townP"></p>
    <div class="scroll"><table class="heat" id="townTable"></table></div>
    <p class="small" data-t="townNote"></p>
  </section>

  <section class="card">
    <h2 data-t="whyH"></h2>
    <p class="sub" data-t="whyP"></p>
    <div class="effects" id="effects"></div>
    <p class="callout" data-t="whyNote"></p>
    <details><summary data-t="allRegions"></summary>
      <p class="small" data-t="corrHelp"></p>
      <div class="scroll"><table class="heat" id="corrTable"></table></div></details>
  </section>

  <section class="card">
    <h2 data-t="oniH"></h2>
    <p class="sub" data-t="oniP"></p>
    <div class="chart"><canvas id="oniChart" role="img"></canvas></div>
    <details><summary data-t="showNumbers"></summary><div class="scroll"><table id="oniTable"></table></div></details>
  </section>

  <section class="card">
    <h2 data-t="worldH"></h2>
    <p class="sub" id="worldP"></p>
    <ul class="regions" id="regions"></ul>
    <details><summary data-t="expertTable"></summary>
      <p class="small" data-t="riskHelp"></p>
      <div class="scroll"><table class="heat" id="riskTable"></table></div></details>
  </section>

  <section class="card">
    <h2 data-t="trustH"></h2>
    <p id="trustP"></p>
    <div class="facts" id="facts"></div>
    <details><summary data-t="expertChart"></summary>
      <div class="chart"><canvas id="skillChart" role="img"></canvas></div>
      <div class="scroll"><table id="skillTable"></table></div></details>
  </section>

  <section class="card">
    <h2 data-t="glossH"></h2>
    <dl id="gloss"></dl>
  </section>

  <footer>
    <p data-t="sources"></p>
    <p data-t="limits"></p>
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const DATA = __DATA__;
const F = DATA.forecast, R = DATA.rain, K = DATA.skill;

// ── Helpers ─────────────────────────────────────────────────────────────────
let lang = "en";
try { lang = new URLSearchParams(location.search).get("lang") || localStorage.getItem("lang") || "en"; } catch (e) {}
if (!T[lang]) lang = "en";
const t = k => T[lang][k];

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const ym = iso => { const [y, m] = iso.split("-").map(Number); return { y, m }; };
const monthName = (iso, short) => { const { y, m } = ym(iso); const n = MONTHS[lang][m - 1];
  return (short && lang === "en" ? n.slice(0, 3) : n) + " " + y; };
const signed = (v, d = 2) => { const s = Math.abs(v).toFixed(d); return (Number(s) === 0 ? "" : v > 0 ? "+" : "−") + s; };
const pct = v => Math.round(v * 100) + "%";
const region = n => (lang === "si" ? REGION_SI[n] || n : n);

function monthRanges(rows) {   // consecutive months → "Oct 2026 – Dec 2026"
  const out = [];
  rows.forEach(r => {
    const { y, m } = ym(r.month), idx = y * 12 + m, last = out[out.length - 1];
    if (last && last.end === idx - 1) { last.end = idx; last.to = r.month; } else out.push({ end: idx, from: r.month, to: r.month });
  });
  if (!out.length) return t("noneList");
  return out.map(g => g.from === g.to ? monthName(g.from) : monthName(g.from) + " – " + monthName(g.to)).join(", ");
}

const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, x) => { const A = hex2rgb(a), B = hex2rgb(b);
  return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * x)).join(",") + ")"; };
const inkOn = rgb => { const L = rgb.match(/\d+/g).map(Number).map(c => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; });
  return 0.2126 * L[0] + 0.7152 * L[1] + 0.0722 * L[2] > 0.3 ? "#0b0b0b" : "#ffffff"; };

function table(el, head, rows) {
  el.innerHTML = "<thead><tr>" + head.map(h => `<th>${h}</th>`).join("") + "</tr></thead><tbody>" +
    rows.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody>";
}
function heatTable(el, matrix, colour, fmt) {
  el.innerHTML = "<thead><tr><th></th>" + matrix.columns.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>" +
    matrix.rows.map(([name, ...vals]) => `<tr><td>${region(name)}</td>` + vals.map(v => {
      const bg = colour(v); return `<td style="background:${bg};color:${inkOn(bg)}">${fmt(v)}</td>`;
    }).join("") + "</tr>").join("") + "</tbody>";
}
const $ = id => document.getElementById(id);

// ── Page text ───────────────────────────────────────────────────────────────
function renderText() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t(el.dataset.t); });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("asof").textContent = t("asof")(monthName(DATA.last_month), DATA.generated);

  // Summary
  const now = DATA.last_oni, lastM = monthName(DATA.last_month);
  const peak = F.reduce((a, b) => (b.oni_mean > a.oni_mean ? b : a));
  const fade = F.find(r => r.month > peak.month && r.oni_mean < 0.5);
  const gain = pct(K.reduce((s, r) => s + r["Skill vs persistence"], 0) / K.length);
  const items = [];
  if (now >= 0.5) items.push(["🌊", t("nowEl")(t("strength")(now), lastM, signed(now), signed(DATA.record.oni), monthName(DATA.record.month))]);
  else if (now <= -0.5) items.push(["🌊", t("nowLa")(lastM, Math.abs(now).toFixed(2))]);
  else items.push(["🌊", t("nowNone")(lastM, signed(now))]);
  if (peak.oni_mean >= 0.5) items.push(["📈", fade ? t("peakFade")(monthName(peak.month), monthName(fade.month))
                                                    : t("peakStay")(monthName(peak.month), monthName(F[F.length - 1].month))]);
  items.push(["🌧️", t("wetList")(monthRanges(R.filter(r => r.rain_anomaly_mm >= NEAR)))]);
  items.push(["☀️", t("dryList")(monthRanges(R.filter(r => r.rain_anomaly_mm <= -NEAR)))]);
  items.push(["✅", t("trust")(gain)]);
  $("summary").innerHTML = items.map(([i, s]) => `<li><span class="ic" aria-hidden="true">${i}</span><span>${s}</span></li>`).join("");

  // Month cards
  $("months").innerHTML = R.map(r => {
    const v = r.rain_anomaly_mm, kind = v >= NEAR ? "wet" : v <= -NEAR ? "dry" : "normal";
    const chance = kind === "dry" ? 1 - r.chance_wetter_than_normal : r.chance_wetter_than_normal;
    const lvl = kind === "normal" ? t("unsure") : chance >= 0.8 ? t("veryLikely") : chance >= 0.6 ? t("likely") : t("unsure");
    const amount = kind === "wet" ? t("amtMore")(Math.round(v)) : kind === "dry" ? t("amtLess")(Math.round(-v)) : t("amtNormal")(NEAR);
    const icon = { wet: "🌧️", dry: "☀️", normal: "⛅" }[kind];
    return `<div class="month ${kind}"><div class="name">${monthName(r.month)}</div>
      <div class="big" aria-hidden="true">${icon}</div><div class="verdict">${t(kind)}</div>
      <div class="amount">${amount}</div><div class="sure">${t("sure")(lvl, pct(chance))}</div></div>`;
  }).join("");

  table($("rainTable"), t("rainHead"), R.map(r => [monthName(r.month), signed(r.rain_anomaly_mm, 0),
    signed(r.p10_mm, 0) + " … " + signed(r.p90_mm, 0), pct(r.chance_wetter_than_normal)]));

  // Season effect for Sri Lanka
  const sl = DATA.corr.rows.find(r => r[0] === "Sri Lanka").slice(1);
  $("effects").innerHTML = sl.map((c, i) => {
    const [e, w] = c >= 0.2 ? ["🌧️", t("effMore")] : c <= -0.2 ? ["☀️", t("effLess")] : ["➖", t("effNone")];
    return `<div class="effect"><div class="e" aria-hidden="true">${e}</div><div class="m">${MONTHS[lang][i]}</div><div class="w">${w}</div></div>`;
  }).join("");

  // Other regions
  const peakCol = DATA.risk.rows.map(r => [r[0], r[r.length - 1]]).sort((a, b) => b[1] - a[1]);
  $("worldP").textContent = t("worldP")(signed(peak.oni_mean, 1));
  $("regions").innerHTML = peakCol.map(([n, v]) => {
    const lvl = v >= 0.5 ? t("lvlVery") : v >= 0.35 ? t("lvlHigh") : t("lvlNormal");
    return `<li><span>${region(n)}</span><span class="lvl">${lvl}</span><span class="times">${t("times")((v / 0.2).toFixed(1))}</span></li>`;
  }).join("");

  // Trust
  $("trustP").innerHTML = t("trustP")(gain);
  $("facts").innerHTML = [[1, "fact1"], [3, "fact3"], [12, "fact12"]].map(([lead, k]) =>
    `<div class="fact"><div class="v">± ${K.find(r => r.lead === lead).Model.toFixed(2)} °C</div><div class="l">${t(k)}</div></div>`).join("");

  table($("oniTable"), t("oniHead"), F.map(r => [monthName(r.month), signed(r.oni_mean),
    signed(r.oni_p10) + " … " + signed(r.oni_p90), pct(r.p_el_nino), pct(r.p_la_nina)]));
  table($("skillTable"), t("skillHead"), K.map(r => [r.lead, r.Model.toFixed(2), r.Persistence.toFixed(2),
    r.Climatology.toFixed(2), pct(r["Skill vs persistence"])]));

  $("gloss").innerHTML = t("gloss").map(([w, d]) => `<dt>${w}</dt><dd>${d}</dd>`).join("");

  const neg = css("--div-neg"), mid = css("--div-mid"), pos = css("--div-pos");
  const corr = { ...DATA.corr, columns: MONTHS[lang].map(m => (lang === "en" ? m.slice(0, 3) : m)) };
  heatTable($("corrTable"), corr, v => v < 0 ? mix(mid, neg, Math.min(1, -v / 0.8)) : mix(mid, pos, Math.min(1, v / 0.8)), v => signed(v, 1));
  const towns = { columns: DATA.towns.months.map(m => monthName(m, true)), rows: DATA.towns.rows };   // cell = [mm, chance wetter]
  heatTable($("townTable"), towns, ([, p]) => p < 0.5 ? mix(mid, neg, Math.min(1, (0.5 - p) / 0.4)) : mix(mid, pos, Math.min(1, (p - 0.5) / 0.4)),
    ([mm]) => signed(mm, 0));
  heatTable($("riskTable"), DATA.risk, v => mix(css("--seq-lo"), css("--seq-hi"), Math.min(1, v / 0.8)), v => v.toFixed(2));
}

// ── Charts ──────────────────────────────────────────────────────────────────
let charts = [];
const thresholdLines = {
  id: "thresholds",
  afterDatasetsDraw(chart) {
    const { ctx, chartArea: a, scales: { y } } = chart;
    ctx.save(); ctx.strokeStyle = css("--axis"); ctx.fillStyle = css("--muted"); ctx.lineWidth = 1;
    ctx.font = "12px system-ui, 'Noto Sans Sinhala', sans-serif";
    [[0.5, t("elLine")], [-0.5, t("laLine")]].forEach(([v, s]) => {
      const py = y.getPixelForValue(v); if (py < a.top || py > a.bottom) return;
      ctx.beginPath(); ctx.moveTo(a.left, py); ctx.lineTo(a.right, py); ctx.stroke(); ctx.fillText(s, a.left + 6, py - 4);
    });
    ctx.restore();
  },
};
function baseOptions(yTitle) {
  const muted = css("--muted"), ink = css("--ink");
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: "index", intersect: false },
    scales: {
      x: { grid: { display: false }, border: { color: css("--axis") }, ticks: { color: muted, maxRotation: 0, autoSkipPadding: 12 } },
      y: { grid: { color: css("--grid") }, border: { display: false }, ticks: { color: muted }, title: { display: true, text: yTitle, color: muted } },
    },
    plugins: {
      legend: { labels: { color: ink, boxWidth: 16, boxHeight: 8 } },
      tooltip: { backgroundColor: css("--surface"), titleColor: ink, bodyColor: ink, borderColor: css("--axis"), borderWidth: 1, padding: 10 },
    },
  };
}
function drawCharts() {
  charts.forEach(c => c.destroy()); charts = [];
  Chart.defaults.font.family = "system-ui, -apple-system, 'Segoe UI', 'Noto Sans Sinhala', sans-serif";
  const s1 = css("--s1"), s2 = css("--s2"), s3 = css("--s3");

  const rainOpts = baseOptions(t("rainAxis"));
  rainOpts.plugins.legend.display = false;
  rainOpts.plugins.tooltip.callbacks = {
    label: i => " " + t("tipExpected")(signed(i.raw, 0)),
    afterLabel: i => { const r = R[i.dataIndex];
      return " " + t("tipRange")(signed(r.p10_mm, 0), signed(r.p90_mm, 0)) + "\n " + t("tipChance")(pct(r.chance_wetter_than_normal)); },
  };
  $("rainChart").setAttribute("aria-label", t("slH"));
  charts.push(new Chart($("rainChart"), {
    type: "bar",
    data: { labels: R.map(r => monthName(r.month, true)), datasets: [{ data: R.map(r => r.rain_anomaly_mm),
      backgroundColor: R.map(r => (r.rain_anomaly_mm >= 0 ? css("--wet") : css("--dry"))),
      borderRadius: 4, borderSkipped: "start", maxBarThickness: 24 }] },
    options: rainOpts,
  }));

  const H = DATA.history, nH = H.length, pad = n => Array(n).fill(null);
  const oniOpts = baseOptions(t("oniAxis"));
  oniOpts.plugins.legend.labels.filter = item => item.text !== "_p10";
  oniOpts.plugins.tooltip.filter = item => item.raw !== null && item.dataset.label !== "_p10";
  oniOpts.plugins.tooltip.callbacks = {
    label: i => i.dataset.label === t("range") ? " " + t("tipRangeC")(signed(F[i.dataIndex - nH].oni_p10), signed(i.raw))
                                                 : ` ${i.dataset.label}: ${signed(i.raw)} °C`,
  };
  const line = (label, data, color) => ({ label, data, borderColor: color, backgroundColor: color,
    borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: 0.25 });
  $("oniChart").setAttribute("aria-label", t("oniH"));
  charts.push(new Chart($("oniChart"), {
    type: "line",
    data: { labels: H.map(r => monthName(r.month, true)).concat(F.map(r => monthName(r.month, true))), datasets: [
      line(t("observed"), H.map(r => r.oni).concat(pad(F.length)), s1),
      line(t("forecast"), pad(nH - 1).concat([H[nH - 1].oni], F.map(r => r.oni_mean)), s2),
      { label: "_p10", data: pad(nH).concat(F.map(r => r.oni_p10)), borderWidth: 0, pointRadius: 0, fill: false },
      { label: t("range"), data: pad(nH).concat(F.map(r => r.oni_p90)), borderWidth: 0, pointRadius: 0,
        fill: "-1", backgroundColor: s2 + "26", borderColor: s2 + "26" },
    ] },
    options: oniOpts, plugins: [thresholdLines],
  }));

  const skillOpts = baseOptions(t("errAxis"));
  skillOpts.scales.x.title = { display: true, text: t("leadAxis"), color: css("--muted") };
  skillOpts.plugins.tooltip.callbacks = { title: i => t("tipLead")(i[0].label), label: i => ` ${i.dataset.label}: ${i.raw.toFixed(2)} °C` };
  const sline = (label, key, color) => ({ ...line(label, K.map(r => r[key]), color), pointRadius: 4, pointBorderColor: css("--surface"), pointBorderWidth: 2 });
  $("skillChart").setAttribute("aria-label", t("trustH"));
  charts.push(new Chart($("skillChart"), {
    type: "line",
    data: { labels: K.map(r => r.lead), datasets: [sline(t("model"), "Model", s1), sline(t("persist"), "Persistence", s2), sline(t("clim"), "Climatology", s3)] },
    options: skillOpts,
  }));
}

function render() { renderText(); if (window.Chart) drawCharts(); }
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("lang", lang); } catch (e) {}
  render();
}));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
render();
</script>
</body>
</html>
